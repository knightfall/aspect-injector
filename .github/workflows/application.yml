name: Application
on:
  push:
    branches:
      - master
    tags:
      - '**'
  pull_request:

env:
  app_conf: Release
  nuget_url: https://api.nuget.org/v3/index.json

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x
      - name: Get version
        run: echo "app_version=$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.0)" >> "$GITHUB_ENV"
      - name: Compile
        run: dotnet build -c "$app_conf" -p:Version="$app_version" -p:InformationalVersion="$app_version:$GITHUB_SHA"
      - name: Test .NET 6 runtime
        run: dotnet test tests/AspectInjector.Tests.Runtime -c "$app_conf" --no-build -f net6.0
      - name: Test .NET 6 Visual Basic
        run: dotnet test tests/AspectInjector.Tests.VBRuntime -c "$app_conf" --no-build -f net6.0
      - name: Test .NET 8
        run: dotnet test -c "$app_conf" --no-build -f net8.0
      - name: Test .NET 10
        run: dotnet test -c "$app_conf" --no-build -f net10.0
      - name: Pack
        if: runner.os == 'Linux'
        run: dotnet pack -c "$app_conf" --no-restore -o artifacts -p:Version="$app_version" -p:InformationalVersion="$app_version:$GITHUB_SHA" -p:CommitSHA="$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: artifacts
          path: ./artifacts
  publish:
    name: Publish NuGet packages
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts
          path: artifacts
      - name: Publish
        env:
          NUGETKEY: ${{ secrets.NUGET_KEY }}
        working-directory: artifacts
        run: dotnet nuget push ./*.nupkg -s "$nuget_url" -k "$NUGETKEY"
