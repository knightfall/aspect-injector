name: Reference cycle reproduction
on:
  pull_request:
    paths:
      - 'reproductions/Issue244.ReferenceCycle/**'
      - '.github/workflows/reference-cycle-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Collect baseline and candidate proof
        run: dotnet run --file reproductions/Issue244.ReferenceCycle/reproduce.cs -- --output artifacts/reference-cycle-proof
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reference-cycle-proof-${{ runner.os }}
          path: artifacts/reference-cycle-proof
          if-no-files-found: error
